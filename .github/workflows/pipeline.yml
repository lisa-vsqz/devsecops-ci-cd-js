name: DevSecOps CI/CD Pipeline

on:
  push:
    branches:
      - "main"
      - "vulnerable-code"

permissions:
  contents: read
  security-events: write
  packages: write

jobs:
  ci-cd:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: npm test

      # MEJORA 1: npm audit SIN || true para que falle si hay vulnerabilidades
      - name: Dependency vulnerability scan
        run: npm audit --audit-level=moderate
        continue-on-error: true # Para que el pipeline siga pero registre el error

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript
          # MEJORA 2: Agregar queries adicionales para detectar más problemas
          queries: +security-extended,security-and-quality

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v3

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build Docker image
        run: docker build -t ghcr.io/${{ github.repository }}/js-api:latest .

      - name: Push Docker image
        run: docker push ghcr.io/${{ github.repository }}/js-api:latest

      # MEJORA 3: Trivy con severidades más bajas para detectar más problemas
      - name: Container security scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository }}/js-api:latest
          severity: MEDIUM,HIGH,CRITICAL # Detectar más niveles
          exit-code: 0 # No fallar, solo reportar
          format: table

      # MEJORA 4: Escaneo adicional de secretos
      - name: Secret scanning (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository }}/js-api:latest
          scan-type: config
          exit-code: 0

      - name: Create Kubernetes cluster
        uses: helm/kind-action@v1

      - name: Deploy to Kubernetes
        run: kubectl apply -f deployment.yaml

      - name: Verify deployment
        run: |
          kubectl get pods
          kubectl get services
