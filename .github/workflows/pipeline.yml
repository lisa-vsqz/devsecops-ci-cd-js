name: DevSecOps CI/CD Pipeline

on:
  push:
    branches:
      - "main"
      - "vulnerable-code"
  pull_request:
    branches:
      - "main"

permissions:
  contents: read
  security-events: write
  packages: write

jobs:
  ci-cd:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: npm test

      # Escaneo de vulnerabilidades en dependencias
      - name: Dependency vulnerability scan (npm audit)
        run: npm audit --audit-level=moderate
        continue-on-error: true

      # Análisis estático de código con CodeQL
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript
          queries: +security-extended,security-and-quality

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v3

      # Build y push de imagen Docker
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build Docker image
        run: docker build -t ghcr.io/${{ github.repository }}/js-api:latest .

      - name: Push Docker image
        run: docker push ghcr.io/${{ github.repository }}/js-api:latest

      # Escaneo de seguridad del contenedor
      - name: Container vulnerability scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository }}/js-api:latest
          format: table
          severity: MEDIUM,HIGH,CRITICAL
          exit-code: 0
        continue-on-error: true

      # Escaneo de secretos en la imagen
      - name: Secret scanning in container (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository }}/js-api:latest
          format: table
          scanners: secret
          exit-code: 0
        continue-on-error: true

      # Escaneo del Dockerfile
      - name: Dockerfile security scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: "./Dockerfile"
          format: table
          exit-code: 0
        continue-on-error: true

      # DAST - Instalar dependencias
      - name: Install dependencies for DAST
        run: npm install

      # DAST - Levantar la aplicación
      - name: Start vulnerable app
        run: |
          mkdir -p /tmp/app-logs
          nohup node src/index.js > /tmp/app-logs/app.log 2>&1 &
          sleep 5
          echo "Checking application status..."
          curl -s http://localhost:3000 || echo "App not responding"

      # DAST - Nikto scan
      - name: Run Nikto DAST scan
        run: |
          mkdir -p ${{ github.workspace }}/nikto-results
          docker run --network="host" -v ${{ github.workspace }}/nikto-results:/tmp secfigo/nikto:latest \
            -h http://localhost:3000 \
            -output /tmp/nikto-report.txt \
            -Format txt || true
        continue-on-error: true

      # DAST - Upload Nikto results
      - name: Upload Nikto scan results
        uses: actions/upload-artifact@v4
        with:
          name: nikto-dast-results
          path: ${{ github.workspace }}/nikto-results/nikto-report.txt
        continue-on-error: true

      # Despliegue a Kubernetes
      - name: Create Kubernetes cluster
        uses: helm/kind-action@v1

      - name: Deploy to Kubernetes
        run: kubectl apply -f deployment.yaml

      - name: Verify deployment
        run: |
          kubectl get pods
          kubectl get services
